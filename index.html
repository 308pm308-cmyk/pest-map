    <title>台灣蟲害預測分布系統</title>

        // Google Maps 載入完成後的進入點：確保 DOM 就緒再初始化地圖
        function __initGoogleMap() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMap);
            } else {
                initMap();
            }
        }
        // 金鑰驗證失敗時，Google Maps 會呼叫此全域函式
        window.gm_authFailure = function () {
            if (typeof handleMapError === 'function') {
                handleMapError(new Error('Google Maps 金鑰驗證失敗：請確認金鑰已啟用 Maps JavaScript API、已綁定計費帳戶，並允許目前網域（HTTP referrer）。'));
            }
        };
    </script>

        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #315B8C 0%, #24466b 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
        }

        .control-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .map-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        #map {
            height: 600px;
            width: 100%;
            border-radius: 10px;
            position: relative;
            z-index: 1;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #315B8C;
            box-shadow: 0 0 0 3px rgba(49, 91, 140, 0.15);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #315B8C 0%, #24466b 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(49, 91, 140, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .result-panel {
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }

        .result-panel.show {
            display: block;
        }

        .signal-light {
            width: 100%;
            height: 100px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .signal-green {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
        }

        .signal-yellow {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
        }

        .signal-red {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .signal-unknown {
            background: linear-gradient(135deg, #6b7280 0%, #9ca3af 100%);
        }

        .signal-water {
            background: linear-gradient(135deg, #0072B2 0%, #56B4E9 100%);
        }

        .prevention-level {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .prevention-level h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .prevention-item {
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #315B8C;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .coordinates-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .legend-color {
            width: 25px;
            height: 25px;
            border-radius: 5px;
            margin-right: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }

            #map {
                height: 400px;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="header">
            <h1>🐛 台灣蟲害預測分布系統 🦋</h1>
            <p>輸入經緯度座標，即時查詢<span id="speciesTitle">斜紋夜蛾</span>風險等級與防治建議（串接雲端 MaxEnt 模型）</p>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <h2 style="color: #333; margin-bottom: 25px;">📍 位置輸入</h2>
                
                <div class="input-group">
                    <label for="speciesSelect">目標物種 (Species)</label>
                    <select id="speciesSelect" onchange="changeSpecies()"
                        style="width:100%;padding:12px 15px;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#fff;cursor:pointer;">
                        <option value="SL">斜紋夜蛾 (Spodoptera litura)</option>
                        <option value="SE">甜菜夜蛾 (Spodoptera exigua)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="latitude">緯度 (Latitude)</label>
                    <input type="number" id="latitude" placeholder="例如: 25.0330" step="0.0001" min="21.5" max="25.5">
                </div>
                
                <div class="input-group">
                    <label for="longitude">經度 (Longitude)</label>
                    <input type="number" id="longitude" placeholder="例如: 121.5654" step="0.0001" min="119.5" max="122.5">
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="predictPest()">🔍 開始預測</button>
                    <button class="btn btn-secondary" onclick="getCurrentLocation()">📍 取得目前位置</button>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="setRandomLocation()">🎲 隨機測試</button>
                    <button class="btn btn-secondary" onclick="clearAll()">🔄 清除重置</button>
                </div>

                <div id="result" class="result-panel">
                    <h3 style="color: #333; margin-bottom: 15px;">🚨 預測結果</h3>
                    <div id="signalLight" class="signal-light"></div>
                    
                    <div class="prevention-level">
                        <h3>🛡️ 防治等級與建議</h3>
                        <div id="preventionSuggestions"></div>
                    </div>
                </div>

                <div class="coordinates-display">
                    <strong>台灣地理範圍</strong><br>
                    緯度: 21.5° - 25.5° N<br>
                    經度: 119.5° - 122.5° E<br>
                    <small style="color: #999; display: block; margin-top: 8px;">
                        模型解析度：1 公里網格
                    </small>
                </div>
            </div>

            <div class="map-container">
                <h2 style="color: #333; margin-bottom: 15px;">🗺️ 地圖顯示</h2>
                <div id="map">
                    <div class="loading" id="mapLoading">地圖載入中...</div>
                </div>
                <div class="legend">
                    <strong style="margin-bottom: 10px; display: block;">風險等級（模型 1 公里網格）</strong>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);"></div>
                        <span>低風險</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);"></div>
                        <span>中風險</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);"></div>
                        <span>高風險</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // 初始化地圖
        function initMap() {
            try {
                console.log('開始初始化地圖 (Google Maps)...');

                // 檢查 Google Maps 是否載入
                if (typeof google === 'undefined' || !google.maps) {
                    console.error('Google Maps 尚未載入');
                    handleMapError(new Error('Google Maps 函式庫尚未載入'));
                    return;
                }

                // 檢查地圖容器是否存在
                const mapContainer = document.getElementById('map');
                if (!mapContainer) {
                    console.error('找不到地圖容器');
                    return;
                }

                // 移除載入提示
                const loadingDiv = document.getElementById('mapLoading');
                if (loadingDiv) {
                    loadingDiv.style.display = 'none';
                }

                // 建立地圖
                map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 23.5, lng: 121 },
                    zoom: 8,
                    mapTypeControl: true,
                    streetViewControl: false,
                    fullscreenControl: true,
                    gestureHandling: 'greedy'
                });

                // 單一資訊視窗實例，marker／circle／田間點共用、切換內容
                infoWindow = new google.maps.InfoWindow();

                // 疊加全台模型預測面 + 田間調查點 + 圖層切換
                setTimeout(() => {
                    setupLayers();
                }, 500);

                console.log('地圖初始化成功 (Google Maps)');

                // 移除錯誤訊息（如果有的話）
                if (loadingDiv) {
                    loadingDiv.style.display = 'none';
                }

            } catch (error) {
                console.error('地圖初始化失敗:', error);
                handleMapError(error);
            }
        }

        // 處理地圖錯誤
        function handleMapError(error) {
            const loadingDiv = document.getElementById('mapLoading');
            if (loadingDiv) {
                loadingDiv.style.display = 'block';
                loadingDiv.innerHTML = `
                    <div style="padding: 20px; color: #666;">
                        <p>地圖載入失敗</p>
                        <p style="font-size: 0.9em; margin: 10px 0;">錯誤訊息: ${error.message}</p>
                        <button onclick="retryMapLoad()" class="btn btn-secondary" style="margin-top: 10px;">
                            🔄 重試載入
                        </button>
                        <p style="font-size: 0.85em; margin-top: 15px; color: #999;">
                            提示：您仍可使用左側功能進行預測，只是無法在地圖上顯示
                        </p>
                    </div>
                `;
            }
        }

        // 重試載入地圖
        function retryMapLoad() {
            const loadingDiv = document.getElementById('mapLoading');
            if (loadingDiv) {
                loadingDiv.innerHTML = '地圖載入中...';
            }
            initMap();
        }

        // 切換目標物種：更新風險點集、標題，並重繪疊圖/田間點/圖層控制
        function changeSpecies() {
            currentSpecies = document.getElementById('speciesSelect').value;
            riskAreas = (currentSpecies === 'SE') ? riskAreasSE : riskAreasSL;
            const zhName = (currentSpecies === 'SE') ? '甜菜夜蛾' : '斜紋夜蛾';
            const t = document.getElementById('speciesTitle');
            if (t) t.textContent = zhName;
            if (map) {
                if (modelOverlay) { modelOverlay.setMap(null); modelOverlay = null; }
                if (waterOverlay) { waterOverlay.setMap(null); waterOverlay = null; }
                if (fieldCircles.length) { fieldCircles.forEach(c => c.setMap(null)); fieldCircles = []; }
                removeLayerControl();
                if (currentMarker) { currentMarker.setMap(null); currentMarker = null; }
                if (predictionCircle) { predictionCircle.setMap(null); predictionCircle = null; }
                if (infoWindow) infoWindow.close();
            }
            const rp = document.getElementById('result');
            if (rp) rp.classList.remove('show');
            setupLayers();
        }

        // 疊加圖層：全台模型預測風險面 (GroundOverlay) + 田間調查點 + 圖層切換控制
        async function setupLayers() {
            if (!map || typeof google === 'undefined' || !google.maps) {
                console.log('地圖或 Google Maps 未就緒');
                return;
            }
            const myRequestId = ++layerRequestId;
            try {
                // 1) 取得預測圖層地理範圍（Google 用 {north,south,east,west}）
                let bounds = { north: 25.299964, south: 21.9001, east: 121.999926, west: 119.3167 };  // 後援預設
                try {
                    const h = await (await fetch(`${API_BASE}/health`)).json();
                    if (h.bounds) {
                        bounds = {
                            north: h.bounds.lat_max, south: h.bounds.lat_min,
                            east: h.bounds.lon_max, west: h.bounds.lon_min
                        };
                    }
                } catch (e) { console.warn('取 bounds 失敗，用預設值', e); }

                // 等待期間若使用者又切換物種，放棄這一次的結果，交給最新的請求處理
                if (myRequestId !== layerRequestId) return;

                // 2) 全台模型預測風險面 (涵蓋所有 ~4.8 萬個 1km 預測格)
                modelOverlay = new google.maps.GroundOverlay(
                    `${API_BASE}/api/maps/${currentSpecies}/overlay?type=risk`, bounds,
                    { opacity: 0.6, clickable: false });
                modelOverlay.setMap(map);

                // 2b) 水域面 (蓋掉未遮罩雲端疊圖在河川/水庫/魚塭上的風險色)
                //     後於模型面加入，繪製順序在上，達到遮蓋效果
                waterOverlay = new google.maps.GroundOverlay(WATER_OVERLAY_PNG, bounds,
                    { opacity: 1, clickable: false });
                waterOverlay.setMap(map);

                // 3) 田間調查點 (預設不顯示，可在右上角圖層面板開啟)
                fieldCircles = [];
                riskAreas.forEach(area => {
                    const color = area.risk === 'high' ? '#eb3349' :
                                 area.risk === 'medium' ? '#f7971e' : '#56ab2f';
                    const circle = new google.maps.Circle({
                        strokeColor: color, strokeOpacity: 1, strokeWeight: 2,
                        fillColor: color, fillOpacity: 0.5,
                        center: { lat: area.lat, lng: area.lng }, radius: 1000,
                        map: null   // 預設隱藏
                    });
                    const info = `<strong>${area.site || '田間調查點'}</strong>${area.town ? ` (${area.town})` : ''}<br>` +
                        `作物: ${area.crop || '-'}<br>` +
                        `風險等級: ${area.risk === 'high' ? '高' : area.risk === 'medium' ? '中' : '低'}<br>` +
                        `模型適存值 EI: ${area.suit != null ? area.suit.toFixed(3) : '-'}<br>` +
                        `座標: ${area.lat.toFixed(4)}, ${area.lng.toFixed(4)}`;
                    circle.addListener('click', (e) => {
                        if (infoWindow) { infoWindow.setContent(info); infoWindow.setPosition(e.latLng); infoWindow.open(map); }
                    });
                    fieldCircles.push(circle);
                });

                // 4) 自訂圖層切換控制面板（Google Maps 無內建，於右上角自建）
                layerControlDiv = buildLayerControl();
                map.controls[google.maps.ControlPosition.TOP_RIGHT].push(layerControlDiv);

                console.log('圖層載入完成 (模型預測面 + 田間點)');
            } catch (error) {
                console.error('setupLayers 發生錯誤:', error);
            }
        }

        // 建立自訂圖層切換面板（取代原本的圖層控制項）
        function buildLayerControl() {
            const div = document.createElement('div');
            div.style.cssText = 'background:#fff;padding:8px 12px;margin:10px;border-radius:6px;' +
                'box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:13px;line-height:1.9;' +
                "font-family:'Microsoft JhengHei',sans-serif;user-select:none;";
            const spName = currentSpecies === 'SE' ? '甜菜' : '斜紋';
            div.innerHTML =
                `<label style="display:block;cursor:pointer;"><input type="checkbox" id="lyrModel" checked> 🗺️ ${spName}夜蛾 模型預測風險面</label>` +
                `<label style="display:block;cursor:pointer;"><input type="checkbox" id="lyrField"> 📍 田間調查點 (${riskAreas.length})</label>` +
                `<label style="display:block;cursor:pointer;"><input type="checkbox" id="lyrWater" checked> 💧 水域 (不評估風險)</label>`;
            div.querySelector('#lyrModel').addEventListener('change', (e) => {
                if (modelOverlay) modelOverlay.setMap(e.target.checked ? map : null);
            });
            div.querySelector('#lyrField').addEventListener('change', (e) => {
                fieldCircles.forEach(c => c.setMap(e.target.checked ? map : null));
            });
            div.querySelector('#lyrWater').addEventListener('change', (e) => {
                if (waterOverlay) waterOverlay.setMap(e.target.checked ? map : null);
            });
            return div;
        }

        };
        function isWaterPoint(lat, lng) {
            const M = WATER_MASK;
            const col = Math.floor((lng - M.xll) / M.cs);
            const row = M.nrows - 1 - Math.floor((lat - M.yll) / M.cs);
            if (col < 0 || col >= M.ncols || row < 0 || row >= M.nrows) return false;
            return M.cells.has(row * M.ncols + col);
        }

        async function predictPest() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lng = parseFloat(document.getElementById('longitude').value);

            if (isNaN(lat) || isNaN(lng)) {
                alert('請輸入有效的經緯度座標！');
                return;
            }
            if (lat < 21.5 || lat > 25.5 || lng < 119.5 || lng > 122.5) {
                alert('請輸入台灣地區範圍內的座標！\n緯度: 21.5° - 25.5° N\n經度: 119.5° - 122.5° E');
                return;
            }

            if (map) {
                if (currentMarker) currentMarker.setMap(null);
                if (predictionCircle) predictionCircle.setMap(null);
                try {
                    const pos = { lat: lat, lng: lng };
                    currentMarker = new google.maps.Marker({ position: pos, map: map });
                    const posInfo = `查詢位置<br>座標: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    if (infoWindow) { infoWindow.setContent(posInfo); infoWindow.open(map, currentMarker); }
                    currentMarker.addListener('click', () => {
                        if (infoWindow) { infoWindow.setContent(posInfo); infoWindow.open(map, currentMarker); }
                    });
                    map.setCenter(pos);
                    map.setZoom(14);
                } catch (e) { console.error('標記失敗:', e); }
            }

            // 落在水域(河川/水庫/湖泊/魚塭)→ 非害蟲棲地，風險顯示「無」、適生度 0，不查 API
            if (isWaterPoint(lat, lng)) {
                displayResult('water', lat, lng, 0);
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/risk/point?lon=${lng}&lat=${lat}&species=${currentSpecies}`);
                if (!resp.ok) {
                    alert(`預測 API 回傳錯誤（HTTP ${resp.status}），請稍後再試。`);
                    console.error('API 回應錯誤:', resp.status, resp.statusText);
                    return;
                }
                const data = await resp.json();
                if (!data.success || !data.predictions || !data.predictions.length) {
                    alert('此座標無模型預測值（可能落在海域或圖層範圍外）');
                    return;
                }
                const pred = data.predictions[0];
                const riskMap = { '高': 'high', '中': 'medium', '低': 'low' };
                const risk = riskMap[pred.risk_level] || 'unknown';
                displayResult(risk, lat, lng, (typeof pred.suitability === 'number') ? pred.suitability : null);
            } catch (e) {
                alert('無法連線到預測 API，請確認網路或 API 服務狀態。\n' + e.message);
                console.error('API 呼叫失敗:', e);
            }
        }

        // 顯示預測結果
        function displayResult(risk, lat, lng, suit) {
            const resultPanel = document.getElementById('result');
            const signalLight = document.getElementById('signalLight');
            const preventionSuggestions = document.getElementById('preventionSuggestions');
            
            resultPanel.classList.add('show');
            
            // 設定燈號
            signalLight.className = 'signal-light';
            let signalText = '';
            let preventionHTML = '';
            
            if (risk === 'water') {
                signalLight.classList.add('signal-water');
                signalText = '⚪ 無風險（水域）';
                preventionHTML = `
                    <div class="prevention-item" style="border-left-color: #0072B2;">
                        <strong>此位置為水域，不評估害蟲風險</strong><br>
                        • 該 1 公里網格以水域為主（河川、水庫、湖泊或魚塭）<br>
                        • 非斜紋夜蛾／甜菜夜蛾之棲地，適生度以 0 呈現<br>
                        • 如需查詢鄰近農地風險，請移動座標至陸域田區
                    </div>
                    <div class="prevention-item">
                        <strong>水域判定依據：</strong><br>
                        OpenStreetMap 面狀水域（水庫＋河道面＋一般水域含魚塭），
                        1 公里網格水域佔比達 50% 以上者
                    </div>
                `;
            } else if (risk === 'unknown') {
                signalLight.classList.add('signal-unknown');
                signalText = '⚪ 無法判定';
                preventionHTML = `
                    <div class="prevention-item" style="border-left-color: #6b7280;">
                        <strong>模型回傳了無法辨識的風險等級</strong><br>
                        • 請稍後再試一次<br>
                        • 若持續發生，可能是預測 API 的回傳格式有變動，請聯絡系統管理者
                    </div>
                `;
            } else if (risk === 'low') {
                signalLight.classList.add('signal-green');
                signalText = '🟢 低風險';
                preventionHTML = `
                    <div class="prevention-item">
                        <strong>等級一：基本防護</strong><br>
                        • 定期巡查田區，觀察作物生長狀況<br>
                        • 維持田間清潔，清除雜草與落葉<br>
                        • 建議每週巡查1-2次<br>
                    </div>
                    <div class="prevention-item">
                        <strong>預防措施：</strong><br>
                        • 使用黏板監測蟲害密度<br>
                        • 保持良好的田間通風<br>
                        • 適當施肥
                    </div>
                `;
            } else if (risk === 'medium') {
                signalLight.classList.add('signal-yellow');
                signalText = '🟡 中風險';
                preventionHTML = `
                    <div class="prevention-item">
                        <strong>等級二：加強監控</strong><br>
                        • 增加巡查頻率至每2-3天一次<br>
                        • 設置誘引器、黏板<br>
                        • 記錄蟲害發生種類與數量
            
                    </div>
                    <div class="prevention-item">
                        <strong>防治措施：</strong><br>
                        • 局部施用生物防治資材<br>
                        • 釋放天敵昆蟲（如寄生蜂）
                    
                    </div>
                `;
            } else {
                signalLight.classList.add('signal-red');
                signalText = '🔴 高風險';
                preventionHTML = `
                    <div class="prevention-item">
                        <strong>等級三：緊急防治</strong><br>
                        • 立即進行全面性防治<br>
                        • 每日監控蟲害發展情況
                    
                        
                    </div>
                    <div class="prevention-item">
                        <strong>緊急措施：</strong><br>
                        • 施用推薦農藥進行化學防治<br>
                        • 移除嚴重受害植株<br>
                        • 實施區域聯防
                    </div>
                    <div class="prevention-item" style="border-left-color: #eb3349;">
                        <strong>⚠️ 警告：</strong><br>
                        請嚴格遵守農藥使用規範<br>
                        建議鄰近農戶共同防治
                    </div>
                `;
            }
            
            signalLight.innerHTML = signalText + (suit != null ? `<br><span style="font-size:1rem;font-weight:normal;">適生度 EI = ${suit.toFixed(3)}</span>` : '');
            preventionSuggestions.innerHTML = preventionHTML;
            
            // 在地圖上顯示預測範圍（0.5公里） - 如果地圖已載入
            if (map && currentMarker) {
                try {
                    const color = risk === 'water' ? '#0072B2' : risk === 'unknown' ? '#6b7280' : risk === 'high' ? '#eb3349' : 
                                 risk === 'medium' ? '#f7971e' : '#56ab2f';

                    predictionCircle = new google.maps.Circle({
                        strokeColor: color, strokeOpacity: 1, strokeWeight: 3,
                        fillColor: color, fillOpacity: 0.2,
                        center: { lat: lat, lng: lng }, radius: 500,  // 預測點顯示500公尺範圍
                        map: map
                    });

                    const rangeInfo = `預測範圍<br>` +
                        `風險等級: ${risk === 'water' ? '無（水域）' : risk === 'unknown' ? '無法判定' : risk === 'high' ? '高' : risk === 'medium' ? '中' : '低'}<br>` +
                        `查詢點周圍 0.5 公里`;
                    predictionCircle.addListener('click', (e) => {
                        if (infoWindow) { infoWindow.setContent(rangeInfo); infoWindow.setPosition(e.latLng); infoWindow.open(map); }
                    });
                } catch (e) {
                    console.error('無法在地圖上顯示預測範圍:', e);
                }
            }
        }

        // 取得目前位置
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('您的瀏覽器不支援地理定位功能');
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                position => {
                    document.getElementById('latitude').value = position.coords.latitude.toFixed(4);
                    document.getElementById('longitude').value = position.coords.longitude.toFixed(4);
                    predictPest();
                },
                error => {
                    alert('無法取得您的位置，請確認是否已開啟定位服務');
                    console.error('定位錯誤:', error);
                }
            );
        }

        // 設定隨機測試位置
        function setRandomLocation() {
            const randomArea = riskAreas[Math.floor(Math.random() * riskAreas.length)];
            // 加入一些隨機偏移 (縮小偏移範圍以配合1公里圈圈)
            const offsetLat = (Math.random() - 0.5) * 0.01;  // 約1公里內的偏移
            const offsetLng = (Math.random() - 0.5) * 0.01;
            
            document.getElementById('latitude').value = (randomArea.lat + offsetLat).toFixed(4);
            document.getElementById('longitude').value = (randomArea.lng + offsetLng).toFixed(4);
            predictPest();
        }

        // 清除所有輸入與結果
        function clearAll() {
            document.getElementById('latitude').value = '';
            document.getElementById('longitude').value = '';
            document.getElementById('result').classList.remove('show');
            
            if (currentMarker && map) {
                currentMarker.setMap(null);
                currentMarker = null;
            }
            
            if (predictionCircle && map) {
                predictionCircle.setMap(null);
                predictionCircle = null;
            }

            if (infoWindow) infoWindow.close();
            
            if (map) {
                map.setCenter({ lat: 23.5, lng: 121 });
                map.setZoom(8);
            }
        }

        // Enter 鍵觸發預測
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM 載入完成');
            
            // 綁定 Enter 鍵事件
            const latInput = document.getElementById('latitude');
            const lngInput = document.getElementById('longitude');
            
            if (latInput) {
                latInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') predictPest();
                });
            }
            
            if (lngInput) {
                lngInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') predictPest();
                });
            }
            
            // 地圖不在此初始化：由 Google Maps API 載入完成後透過 callback(__initGoogleMap) 自動觸發
        });

        // 逾時偵測：若 Google Maps 遲遲未載入（網路或金鑰問題），顯示錯誤提示
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (!map && (typeof google === 'undefined' || !google.maps)) {
                    console.error('Google Maps 逾時未載入');
                    handleMapError(new Error('Google Maps 載入逾時，請檢查網路連線與 API 金鑰設定'));
                }
            }, 6000);
        });
    </script>
